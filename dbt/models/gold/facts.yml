version: 2

models:
  - name: fact_order
    description: One non-quarantined order with customer/date keys and delivery measures.
    config:
      contract: {enforced: true}
      meta: {grain: order_id, data_class: private_internal, work_item: IMP-M3-013}
    columns:
      - {name: order_key, data_type: varchar, data_tests: [not_null, unique]}
      - {name: order_id, data_type: varchar, data_tests: [not_null, unique]}
      - name: customer_key
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_customer')", field: customer_key}
      - name: purchase_date_key
        data_type: "number(38, 0)"
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_date')", field: date_key}
      - name: delivered_date_key
        data_type: "number(38, 0)"
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_date')", field: date_key}
      - name: estimated_delivery_date_key
        data_type: "number(38, 0)"
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_date')", field: date_key}
      - {name: order_status, data_type: varchar, data_tests: [not_null]}
      - {name: analysis_scope_status, data_type: varchar, data_tests: [not_null]}
      - {name: analysis_scope_reason, data_type: varchar, data_tests: [not_null]}
      - {name: order_purchase_timestamp, data_type: "timestamp_ntz(6)", data_tests: [not_null]}
      - {name: order_delivered_customer_date, data_type: "timestamp_ntz(6)"}
      - {name: order_estimated_delivery_date, data_type: "timestamp_ntz(6)", data_tests: [not_null]}
      - {name: delivery_interval_valid, data_type: boolean, data_tests: [not_null]}
      - {name: delivery_lead_seconds, data_type: "number(38, 0)"}
      - {name: delivery_delay_seconds, data_type: "number(38, 0)"}
      - {name: is_on_time_delivery, data_type: boolean}
      - {name: order_count, data_type: "number(38, 0)", data_tests: [not_null]}
      - {name: source_release_id, data_type: varchar, data_tests: [not_null]}
      - {name: ingestion_batch_id, data_type: varchar, data_tests: [not_null]}
      - {name: dataset_run_id, data_type: varchar, data_tests: [not_null]}
      - {name: source_record_hash, data_type: varchar, data_tests: [not_null]}
      - {name: ingested_at, data_type: "timestamp_tz(6)", data_tests: [not_null]}
      - {name: model_contract_version, data_type: varchar, data_tests: [not_null]}
    data_tests:
      - reviewlens_expression_is_true:
          arguments: {expression: "analysis_scope_status != 'QUARANTINED' and order_count = 1"}

  - name: fact_order_item
    description: One valid order item with conformed product and seller keys.
    config:
      contract: {enforced: true}
      meta: {grain: "order_id + order_item_id", data_class: private_internal, work_item: IMP-M3-013}
    columns:
      - {name: order_item_key, data_type: varchar, data_tests: [not_null, unique]}
      - name: order_key
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('fact_order')", field: order_key}
      - {name: order_id, data_type: varchar, data_tests: [not_null]}
      - {name: order_item_id, data_type: "number(38, 0)", data_tests: [not_null]}
      - name: product_key
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_product')", field: product_key}
      - name: seller_key
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_seller')", field: seller_key}
      - name: shipping_limit_date_key
        data_type: "number(38, 0)"
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_date')", field: date_key}
      - {name: shipping_limit_date, data_type: "timestamp_ntz(6)", data_tests: [not_null]}
      - {name: price, data_type: "number(38, 18)", data_tests: [not_null]}
      - {name: freight_value, data_type: "number(38, 18)", data_tests: [not_null]}
      - {name: item_total_value, data_type: "number(38, 18)", data_tests: [not_null]}
      - {name: item_count, data_type: "number(38, 0)", data_tests: [not_null]}
      - {name: source_release_id, data_type: varchar, data_tests: [not_null]}
      - {name: ingestion_batch_id, data_type: varchar, data_tests: [not_null]}
      - {name: dataset_run_id, data_type: varchar, data_tests: [not_null]}
      - {name: source_record_hash, data_type: varchar, data_tests: [not_null]}
      - {name: ingested_at, data_type: "timestamp_tz(6)", data_tests: [not_null]}
      - {name: model_contract_version, data_type: varchar, data_tests: [not_null]}
    data_tests:
      - reviewlens_unique_combination:
          arguments: {combination_of_columns: [order_id, order_item_id]}
      - reviewlens_expression_is_true:
          arguments: {expression: "item_total_value = price + freight_value and item_count = 1"}

  - name: fact_payment
    description: One valid payment sequence joined to one conformed order.
    config:
      contract: {enforced: true}
      meta: {grain: "order_id + payment_sequential", data_class: private_internal, work_item: IMP-M3-013}
    columns:
      - {name: payment_key, data_type: varchar, data_tests: [not_null, unique]}
      - name: order_key
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('fact_order')", field: order_key}
      - {name: order_id, data_type: varchar, data_tests: [not_null]}
      - {name: payment_sequential, data_type: "number(38, 0)", data_tests: [not_null]}
      - {name: payment_type, data_type: varchar, data_tests: [not_null]}
      - {name: payment_installments, data_type: "number(38, 0)", data_tests: [not_null]}
      - {name: payment_value, data_type: "number(38, 18)", data_tests: [not_null]}
      - {name: payment_count, data_type: "number(38, 0)", data_tests: [not_null]}
      - {name: source_release_id, data_type: varchar, data_tests: [not_null]}
      - {name: ingestion_batch_id, data_type: varchar, data_tests: [not_null]}
      - {name: dataset_run_id, data_type: varchar, data_tests: [not_null]}
      - {name: source_record_hash, data_type: varchar, data_tests: [not_null]}
      - {name: ingested_at, data_type: "timestamp_tz(6)", data_tests: [not_null]}
      - {name: model_contract_version, data_type: varchar, data_tests: [not_null]}
    data_tests:
      - reviewlens_unique_combination:
          arguments: {combination_of_columns: [order_id, payment_sequential]}
      - reviewlens_expression_is_true:
          arguments: {expression: "payment_count = 1"}

  - name: fact_review_base
    description: Valid score/review-order fact with no title, comment or AI result dependency.
    config:
      contract: {enforced: true}
      meta:
        grain: "review_id + order_id"
        data_class: private_minimized
        contains_review_text: false
        independent_of_ai_coverage: true
        work_item: IMP-M3-013
    columns:
      - {name: review_key, data_type: varchar, data_tests: [not_null, unique]}
      - name: order_key
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('fact_order')", field: order_key}
      - {name: review_id, data_type: varchar, data_tests: [not_null]}
      - {name: order_id, data_type: varchar, data_tests: [not_null]}
      - name: review_date_key
        data_type: "number(38, 0)"
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_date')", field: date_key}
      - name: review_score
        data_type: "number(38, 0)"
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [1, 2, 3, 4, 5], quote: false}
      - {name: order_analysis_scope_status, data_type: varchar, data_tests: [not_null]}
      - {name: review_creation_date, data_type: "timestamp_ntz(6)", data_tests: [not_null]}
      - {name: review_answer_timestamp, data_type: "timestamp_ntz(6)", data_tests: [not_null]}
      - {name: review_text_present, data_type: boolean, data_tests: [not_null]}
      - {name: response_latency_seconds, data_type: "number(38, 0)", data_tests: [not_null]}
      - {name: ai_eligibility_status, data_type: varchar, data_tests: [not_null]}
      - {name: ai_eligible, data_type: boolean, data_tests: [not_null]}
      - {name: dlp_projection_required, data_type: boolean, data_tests: [not_null]}
      - {name: review_count, data_type: "number(38, 0)", data_tests: [not_null]}
      - {name: source_release_id, data_type: varchar, data_tests: [not_null]}
      - {name: ingestion_batch_id, data_type: varchar, data_tests: [not_null]}
      - {name: dataset_run_id, data_type: varchar, data_tests: [not_null]}
      - {name: source_record_hash, data_type: varchar, data_tests: [not_null]}
      - {name: ingested_at, data_type: "timestamp_tz(6)", data_tests: [not_null]}
      - {name: model_contract_version, data_type: varchar, data_tests: [not_null]}
    data_tests:
      - reviewlens_unique_combination:
          arguments: {combination_of_columns: [review_id, order_id]}
      - reviewlens_expression_is_true:
          arguments: {expression: "response_latency_seconds >= 0 and review_count = 1 and not ai_eligible"}
