selectors:
  - name: m1_foundation
    description: Parse/compile-safe M1 dbt foundation without business-data execution.
    definition:
      union:
        - method: tag
          value: m1_foundation
        - method: source
          value: bronze_olist
  - name: m3_bronze_contract
    description: Test all nine immutable Olist Bronze sources before a Silver candidate build.
    definition:
      method: source
      value: bronze_olist
  - name: m3_silver_candidate
    description: Build and test the isolated M3 Silver candidate models and runtime gate.
    definition:
      method: tag
      value: m3_silver
  - name: m3_silver_critical
    description: Fail-closed publication gate for critical metadata-only Silver findings.
    definition:
      method: tag
      value: m3_critical
  - name: m3_gold_base
    description: Build and test candidate-bound conformed dimensions and base facts.
    definition:
      method: tag
      value: m3_gold_base
  - name: m3_review_attribution
    description: Build and reconcile the versioned review-to-item allocation bridge.
    definition:
      method: tag
      value: m3_review_attribution
  - name: m3_gold_marts
    description: Build and reconcile the four metric-dictionary v1 Gold marts.
    definition:
      method: tag
      value: m3_gold_marts
  - name: m3_semantic
    description: Build and test the four candidate-bound curated semantic views.
    definition:
      method: tag
      value: m3_semantic
  - name: m3_gold_candidate
    description: Build/test isolated Gold outputs from one tested Silver candidate.
    definition:
      union:
        - method: tag
          value: m3_gold_base
        - method: tag
          value: m3_review_attribution
        - method: tag
          value: m3_gold_marts
        - method: tag
          value: m3_semantic
        - method: tag
          value: m3_gold_candidate
