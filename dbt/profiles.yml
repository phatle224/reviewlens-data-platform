reviewlens:
  target: local
  outputs:
    local:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: REVIEWLENS_TRANSFORM_SVC
      private_key_path: "{{ env_var('SNOWFLAKE_TRANSFORM_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_TRANSFORM_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: TRANSFORMER_ROLE
      database: REVIEWLENS
      warehouse: REVIEWLENS_WH
      schema: SILVER
      threads: 2
      client_session_keep_alive: false
      reuse_connections: true
      connect_retries: 1
      connect_timeout: 10
      query_tag: reviewlens:transform:dbt
