name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  foundation-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python
        run: uv python install

      - name: Sync locked foundation dependencies
        run: uv sync --locked --group airflow --group dbt

      - name: Format and lint
        run: |
          uv run --no-sync ruff format --check src tests airflow
          uv run --no-sync ruff check src tests airflow
          uv run --no-sync ruff check airflow --select AIR301,AIR302,AIR303

      - name: Type check
        run: uv run --no-sync mypy src tests

      - name: Unit and contract tests
        run: >-
          uv run --no-sync pytest
          --cov=reviewlens --cov-branch --cov-report=term-missing
          -q -p no:cacheprovider

      - name: Parse and compile dbt without provider introspection
        env:
          SNOWFLAKE_ACCOUNT: synthetic-account
          SNOWFLAKE_TRANSFORM_PRIVATE_KEY_PATH: synthetic-key.p8
        run: |
          uv run --no-sync dbt --no-use-colors --warn-error parse \
            --project-dir dbt --profiles-dir dbt --no-partial-parse
          uv run --no-sync dbt --no-use-colors --warn-error --no-populate-cache compile \
            --project-dir dbt --profiles-dir dbt --no-introspect \
            --select source_contract_registry

      - name: Enforce secret, raw-data and reviewed-container policy
        run: uv run --no-sync reviewlens-policy --root .

      - name: Validate immutable local artifact metadata
        run: |
          uv run --no-sync reviewlens-artifacts --check
          echo "REVIEWLENS_ARTIFACT_TAG=$(uv run --no-sync reviewlens-artifacts --print-tag)" >> "$GITHUB_ENV"

      - name: Validate single-local Compose configuration
        run: docker compose config --quiet

      - name: Build pinned local images
        run: docker compose build app airflow

      - name: Verify final container users are non-root
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "reviewlens/app:${REVIEWLENS_ARTIFACT_TAG}")" = "10001:10001"
          test "$(docker image inspect --format '{{.Config.User}}' "reviewlens/airflow:${REVIEWLENS_ARTIFACT_TAG}")" = "50000:0"

      - name: Verify image dependency consistency
        run: |
          docker run --rm --entrypoint uv "reviewlens/app:${REVIEWLENS_ARTIFACT_TAG}" pip check --python /opt/reviewlens/.venv/bin/python
          docker run --rm --entrypoint python "reviewlens/airflow:${REVIEWLENS_ARTIFACT_TAG}" -m pip check

      - name: Scan app image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: reviewlens/app:${{ env.REVIEWLENS_ARTIFACT_TAG }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          scanners: vuln

      - name: Scan Airflow image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: reviewlens/airflow:${{ env.REVIEWLENS_ARTIFACT_TAG }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          scanners: vuln

      - name: Audit locked environment dependencies
        run: |
          uv export --locked --all-groups --all-extras --no-emit-project --no-annotate \
            --output-file "${RUNNER_TEMP}/audit-requirements.txt"
          uv run --no-sync pip-audit \
            --requirement "${RUNNER_TEMP}/audit-requirements.txt" \
            --strict --require-hashes --disable-pip --progress-spinner=off

      - name: Validate project status evidence
        run: >-
          uv run --no-sync python
          .agents/skills/reviewlens-dev-workflow/scripts/validate_project_status.py
          --root .

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
